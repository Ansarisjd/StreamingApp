apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamingapp.fullname" . }}-chat
  labels:
    app: {{ include "streamingapp.name" . }}
    component: chat
spec:
  type: ClusterIP
  selector:
    app: {{ include "streamingapp.name" . }}
    component: chat
  ports:
    - name: http
      port: {{ .Values.service.chat.port }}
      targetPort: {{ .Values.service.chat.targetPort }}
      protocol: TCP
