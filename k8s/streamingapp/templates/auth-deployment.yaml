apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamingapp.fullname" . }}-auth
  labels:
    app: {{ include "streamingapp.name" . }}
    component: auth
spec:
  replicas: {{ .Values.replicaCount.auth }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "streamingapp.name" . }}
      component: auth
  template:
    metadata:
      labels:
        app: {{ include "streamingapp.name" . }}
        component: auth
    spec:
      containers:
        - name: auth
          image: "{{ .Values.images.auth.repository }}:{{ .Values.images.auth.tag }}"
          imagePullPolicy: {{ .Values.images.auth.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.auth.targetPort }}
              protocol: TCP

          env:
            - name: PORT
              value: "3001"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: JWT_SECRET

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: CLIENT_URLS
              value: {{ .Values.clientUrls | quote }}

            - name: AWS_REGION
              value: "ap-south-1"

          resources:
            {{- toYaml .Values.resources.auth | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
