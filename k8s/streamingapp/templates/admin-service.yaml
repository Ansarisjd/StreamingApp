apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamingapp.fullname" . }}-admin
  labels:
    app: {{ include "streamingapp.name" . }}
    component: admin
spec:
  type: ClusterIP
  selector:
    app: {{ include "streamingapp.name" . }}
    component: admin
  ports:
    - name: http
      port: {{ .Values.service.admin.port }}
      targetPort: {{ .Values.service.admin.targetPort }}
      protocol: TCP
